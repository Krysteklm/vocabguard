# Builds VocabGuard on GitHub and publishes it as a Release with a direct download link:
#   https://github.com/<user>/<repo>/releases/latest/download/VocabGuard.apk
# Every build is signed with YOUR key (from repository secrets), so each new APK installs
# as an update over the previous one: no uninstalling, words and permissions are kept.
name: Build APK

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]        # and automatically after every change

permissions:
  contents: write           # needed to publish the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD first (see README). Without a fixed key every build would need a reinstall."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > vocabguard.jks
          {
            echo "storeFile=vocabguard.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: gradle assembleDebug -PversionCode=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VocabGuard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VocabGuard ${{ github.run_number }}
          files: VocabGuard.apk
          make_latest: true
